name: WA Apple Health PDL watch

# Runs on GitHub's servers, so it works whether or not your laptop is on.
#
# 20 15 UTC = 07:20 Pacific in winter, 08:20 Pacific in summer. Deliberately
# not on the hour - everything in the world fires at :00 and queued runs get
# delayed.
on:
  schedule:
    - cron: "20 15 * * *"
  # lets you run it by hand from the Actions tab, which is the fastest way to
  # confirm the setup works
  workflow_dispatch:

permissions:
  contents: write   # commit the updated baseline back
  issues: write     # post the alert as an issue, so GitHub notifies you

# never let two runs fight over the baseline
concurrency:
  group: pdl-watch
  cancel-in-progress: false

jobs:
  check:
    # Pinned rather than ubuntu-latest: GitHub migrates the "latest" label to a
    # new Ubuntu release partway through a project, which is the kind of
    # surprise nobody needs. Revisit when 24.04 is retired.
    runs-on: ubuntu-24.04
    # the PDL is a 12.5 MB spreadsheet and the link is often slow
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the PDL for changes
        env:
          # GITHUB_TOKEN is NOT automatically exposed to a step as an
          # environment variable. Without this line the job detects the change
          # perfectly and then silently fails to tell anyone. That is exactly
          # what happened on the first attempt.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # These two are public values, not secrets. Nothing to configure.
          PDL_SMTP_HOST: smtp.gmail.com
          PDL_SMTP_PORT: "587"
          # Leave these unset and the alert still reaches you, as a GitHub
          # issue. Set them only if you want it in your own inbox instead.
          PDL_SMTP_USER: ${{ secrets.PDL_SMTP_USER }}
          PDL_SMTP_PASS: ${{ secrets.PDL_SMTP_PASS }}
        run: python pdl_watch.py --ci

      - name: Commit the updated baseline
        run: |
          if git diff --quiet -- baseline.json; then
            echo "No coverage change - nothing to commit."
            exit 0
          fi
          git config user.name  "pdl-watch"
          git config user.email "pdl-watch@users.noreply.github.com"
          git add baseline.json
          git commit -m "PDL baseline update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          echo "Baseline updated, so tomorrow compares against today."

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdl-history
          path: |
            history.jsonl
            ALERT.txt
          retention-days: 90
          if-no-files-found: ignore
